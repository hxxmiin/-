<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 학습 도우미</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, '맑은 고딕', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 10px; margin: 0; }
        .app-container { background-color: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        .tab-menu { display: flex; justify-content: space-around; background-color: #eee; border-radius: 10px; padding: 5px; margin-bottom: 20px; }
        .tab-menu button { background-color: transparent; color: #555; border: none; padding: 10px 5px; border-radius: 8px; cursor: pointer; font-weight: bold; flex-grow: 1; font-size: 0.9rem; }
        .tab-menu button:hover { background-color: #ddd; }
        .tab-menu button.active { background-color: #74b9ff; color: white; }

        .achievement-box { background-color: #e3f2fd; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .achievement-title { font-weight: bold; font-size: 1.1rem; color: #0984e3; margin-bottom: 8px; }
        .progress-bar-bg { background-color: #e0e0e0; height: 18px; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar-fill { background-color: #74b9ff; height: 100%; width: 0%; transition: width 0.3s ease; }
        .achievement-stats { font-size: 0.95rem; color: #555; font-weight: bold; }

        .tab-content { background-color: #fcfcfc; border: 2px solid #eee; border-radius: 15px; padding: 15px; display: none; }
        .tab-content.active { display: block; }
        
        input[type="text"], input[type="date"], textarea, select, input[type="time"] { 
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 10px; font-family: inherit; box-sizing: border-box; -webkit-appearance: none;
        }
        
        .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-primary { background-color: #74b9ff; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; box-sizing: border-box; font-size: 0.95rem; }
        .btn-primary:hover { background-color: #0984e3; }
        .btn-magic { background-color: #fdcb6e; color: #333; }
        .btn-copy { background-color: #00b894; color: white; }
        
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { padding: 10px; border-bottom: 1px dashed #ddd; display: flex; align-items: center; justify-content: space-between; }
        li .todo-left { display: flex; align-items: center; }
        li input[type="checkbox"] { margin-right: 10px; width: 22px; height: 22px; cursor: pointer; }
        .done-text { text-decoration: line-through; color: #aaa; }
        
        .date-label { font-size: 0.9rem; font-weight: bold; color: #555; margin-bottom: 5px; display: block; }
        .guide-text { font-size: 0.85rem; color: #666; margin-bottom: 8px; line-height: 1.3; }

        .diary-card { background-color: white; border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="achievement-box">
            <div class="achievement-title" id="monthTitle">🗓️ 이번 달 공부 달성률</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="achievement-stats">
                목표 <span id="totalCount">0</span>개 중 <span id="doneCount">0</span>개 완료! (<span id="percentText">0%</span>)
            </div>
        </div>

        <div class="tab-menu" id="tabMenu">
            <button class="active" onclick="changeTab('todo', this)">📅 계획표</button>
            <button onclick="changeTab('diary', this)">📝 공스타그램</button>
            <button onclick="changeTab('settings', this)">⚙ 설정</button>
        </div>

        <!-- 1. 계획표 탭 -->
        <div id="todo" class="tab-content active">
            <label class="date-label" for="taskDate">날짜 선택:</label>
            <input type="date" id="taskDate" onchange="renderTodoList()">

            <input type="text" id="todoInput" placeholder="할 일을 적어주세요!">
            <button class="btn-primary" onclick="addTodo()">추가하기</button>
            
            <ul id="todoList"></ul>
        </div>

        <!-- 2. 공스타그램 탭 -->
        <div id="diary" class="tab-content">
            <h3>📝 오늘의 공스타그램</h3>
            <p class="guide-text">💡 공부 내용을 요약하고 '복사하기'를 눌러 외부 AI에게 쉽게 전달하세요!</p>
            
            <div class="btn-group">
                <button class="btn-primary btn-magic" onclick="summarizeTodayTasks()">✨ 내용 요약</button>
                <button class="btn-primary btn-copy" onclick="copyToClipboard()">📋 복사하기</button>
            </div>
            
            <textarea id="diaryContent" rows="6" placeholder="요약 버튼을 누르거나 생성된 일기 내용을 여기에 붙여넣어 보세요!"></textarea>
            <button class="btn-primary" onclick="saveDiaryFeed()">내 피드에 저장하기</button>
            <div id="diaryFeed"></div>
        </div>

        <!-- 3. 설정 탭 -->
        <div id="settings" class="tab-content">
            <h3>⚙️ 알림 설정</h3>
            <p>⏰ 공부 알림 시간</p>
            <input type="time" id="studyTime"> 
            <p>🔄 복습 알림 주기</p>
            <select id="reviewCycle">
                <option>매일 저녁 8시</option>
                <option>일주일에 한 번 (일요일)</option>
                <option>알림 끄기</option>
            </select>
            <button class="btn-primary" onclick="alert('설정이 저장되었습니다!')">설정 저장하기</button>
        </div>

    </div>

    <script>
        let todoData = [];
        let diaryFeedData = [];

        window.onload = function() {
            let today = new Date().toISOString().substring(0, 10);
            document.getElementById('taskDate').value = today;

            // 로컬 스토리지에서 데이터 복원
            loadSavedData();

            updateMonthTitle();
            renderTodoList();
            renderDiaryFeed();
        };

        function changeTab(tabId, clickedButton) {
            document.getElementById('todo').classList.remove('active');
            document.getElementById('diary').classList.remove('active');
            document.getElementById('settings').classList.remove('active');
            
            var buttons = document.getElementById('tabMenu').getElementsByTagName('button');
            for(var i=0; i<buttons.length; i++) {
                buttons[i].classList.remove('active');
            }

            document.getElementById(tabId).classList.add('active');
            clickedButton.classList.add('active');
        }

        // 로컬 스토리지 데이터 불러오기
        function loadSavedData() {
            let savedTodos = localStorage.getItem('study_todoData');
            if (savedTodos) todoData = JSON.parse(savedTodos);

            let savedFeeds = localStorage.getItem('study_diaryFeedData');
            if (savedFeeds) diaryFeedData = JSON.parse(savedFeeds);
        }

        function addTodo() {
            let dateVal = document.getElementById('taskDate').value;
            let textVal = document.getElementById('todoInput').value;

            if (!dateVal || !textVal) { alert("날짜와 할 일을 입력해주세요!"); return; }

            todoData.push({ id: Date.now(), date: dateVal, text: textVal, done: false });
            document.getElementById('todoInput').value = "";
            
            saveAndRenderTodo();
        }

        function toggleTodo(id) {
            for (let i = 0; i < todoData.length; i++) {
                if (todoData[i].id === id) {
                    todoData[i].done = !todoData[i].done;
                    break;
                }
            }
            saveAndRenderTodo();
        }

        function saveAndRenderTodo() {
            localStorage.setItem('study_todoData', JSON.stringify(todoData));
            renderTodoList();
        }

        function renderTodoList() {
            let selectedDate = document.getElementById('taskDate').value;
            let listUl = document.getElementById('todoList');
            listUl.innerHTML = "";

            let dayTasks = todoData.filter(item => item.date === selectedDate);
            
            dayTasks.forEach(item => {
                let li = document.createElement('li');
                let leftDiv = document.createElement('div');
                leftDiv.className = 'todo-left';

                let checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = item.done;
                checkbox.onclick = function() { toggleTodo(item.id); };

                let span = document.createElement('span');
                span.innerText = item.text;
                if (item.done) span.className = 'done-text';

                leftDiv.appendChild(checkbox);
                leftDiv.appendChild(span);
                li.appendChild(leftDiv);
                listUl.appendChild(li);
            });

            if (selectedDate) {
                let currentYearMonth = selectedDate.substring(0, 7);
                let monthTasks = todoData.filter(item => item.date.startsWith(currentYearMonth));

                let total = monthTasks.length;
                let doneCount = monthTasks.filter(item => item.done).length;
                let percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);

                document.getElementById('totalCount').innerText = total;
                document.getElementById('doneCount').innerText = doneCount;
                document.getElementById('percentText').innerText = percent + "%";
                document.getElementById('progressBar').style.width = percent + "%";

                updateMonthTitle(currentYearMonth);
            }
        }

        function updateMonthTitle(yearMonth) {
            if (!yearMonth) yearMonth = new Date().toISOString().substring(0, 7);
            let month = parseInt(yearMonth.split('-')[1]);
            document.getElementById('monthTitle').innerText = "🗓️ " + month + "월 공부 달성률";
        }

        function summarizeTodayTasks() {
            let selectedDate = document.getElementById('taskDate').value;
            let todayDoneTasks = todoData.filter(item => item.date === selectedDate && item.done);

            if (todayDoneTasks.length === 0) {
                alert("선택한 날짜에 완료(체크)된 할 일이 없습니다! 먼저 할 일을 끝내고 체크해 주세요.");
                return;
            }

            let taskSummary = todayDoneTasks.map(t => t.text).join(", ");
            document.getElementById('diaryContent').value = `오늘 완료한 공부: ${taskSummary}`;
        }

        function copyToClipboard() {
            let textarea = document.getElementById('diaryContent');
            let text = textarea.value.trim();

            if (!text) {
                alert("복사할 내용이 없습니다! 먼저 요약 버튼을 누르거나 텍스트를 입력해 주세요.");
                return;
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("📋 클립보드에 복사되었습니다!");
                });
            } else {
                textarea.select();
                document.execCommand('copy');
                alert("📋 클립보드에 복사되었습니다!");
            }
        }

        function saveDiaryFeed() {
            let text = document.getElementById('diaryContent').value.trim();
            if(!text) { alert("일기 내용을 적어주세요!"); return; }

            let todayStr = document.getElementById('taskDate').value;
            diaryFeedData.unshift({ id: Date.now(), date: todayStr, content: text });

            localStorage.setItem('study_diaryFeedData', JSON.stringify(diaryFeedData));

            document.getElementById('diaryContent').value = "";
            renderDiaryFeed();
            alert("📸 공스타그램 피드에 저장되었습니다!");
        }

        function renderDiaryFeed() {
            let feed = document.getElementById('diaryFeed');
            feed.innerHTML = "";

            diaryFeedData.forEach(item => {
                let card = document.createElement('div');
                card.className = 'diary-card';
                card.innerHTML = `<p><strong>📅 ${item.date}의 공부 일기 ✨</strong></p><p>${item.content.replace(/\n/g, '<br>')}</p>`;
                feed.appendChild(card);
            });
        }
    </script>

</body>
</html>
